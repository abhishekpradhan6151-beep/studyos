# Local development and isolated CI only. Hosted auth settings are managed separately.
project_id = "studyos"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[studio]
enabled = false
# Move the local mail-capture UI off Supabase's common default host port.
# Auth email is still captured locally; no messages leave the test environment.
[local_smtp]
enabled = true
port = 56324
[storage]
enabled = true
file_size_limit = "8MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3000/auth/callback?next=/reset-password", "http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?next=/reset-password"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1s"
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
token_verifications = 100
[edge_runtime]
enabled = false
[analytics]
enabled = false
